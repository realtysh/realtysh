name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site and Firebase config
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID || secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          mkdir -p site
          cp index.html favicon.png post.html styles.css posts.css post.js script.js robots.txt sitemap.xml naver67821871de9a89c332917067e316e832.html google406b1ef14534d6cc.html site/
          node <<'NODE'
          const fs = require('node:fs');
          const requiredKeys = [
            'FIREBASE_API_KEY',
            'FIREBASE_AUTH_DOMAIN',
            'FIREBASE_PROJECT_ID',
            'FIREBASE_STORAGE_BUCKET',
            'FIREBASE_MESSAGING_SENDER_ID',
            'FIREBASE_APP_ID'
          ];
          const missingKeys = requiredKeys.filter((key) => !process.env[key]);
          const config = {
            apiKey: process.env.FIREBASE_API_KEY,
            authDomain: process.env.FIREBASE_AUTH_DOMAIN,
            projectId: process.env.FIREBASE_PROJECT_ID,
            storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
            messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
            appId: process.env.FIREBASE_APP_ID
          };
          if (process.env.FIREBASE_MEASUREMENT_ID) {
            config.measurementId = process.env.FIREBASE_MEASUREMENT_ID;
          }
          const output = missingKeys.length ? null : config;
          for (const pagePath of ['site/index.html', 'site/post.html']) {
            const html = fs.readFileSync(pagePath, 'utf8')
              .replaceAll('__BUILD_ID__', process.env.GITHUB_SHA);
            fs.writeFileSync(pagePath, html);
          }
          fs.writeFileSync('site/firebase-config.js', `window.REALTYSH_FIREBASE_CONFIG = ${JSON.stringify(output)};\n`);
          console.log(missingKeys.length
            ? `Firebase config incomplete; using local favorites. Missing: ${missingKeys.join(', ')}`
            : 'Firebase web config generated.');
          NODE
                # Firestore 寃뚯떆湲 二쇱냼瑜?sitemap.xml???먮룞 異붽?
      - name: Generate post sitemap
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          async function main() {
            const projectId = process.env.FIREBASE_PROJECT_ID;
            const apiKey = process.env.FIREBASE_API_KEY;

            if (!projectId || !apiKey) {
              throw new Error('Firebase project ID or API key is missing.');
            }

            let url =
              `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/posts?pageSize=100&key=${apiKey}`;

            const postIds = [];

            while (url) {
              const response = await fetch(url);

              if (!response.ok) {
                throw new Error(`Firestore request failed: ${response.status} ${await response.text()}`);
              }

              const data = await response.json();

              for (const doc of data.documents || []) {
                postIds.push(doc.name.split('/').pop());
              }

              url = data.nextPageToken
                ? `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/posts?pageSize=100&pageToken=${encodeURIComponent(data.nextPageToken)}&key=${apiKey}`
                : '';
            }

            const urls = [
              '  <url>',
              '    <loc>https://realtysh.com/</loc>',
              '  </url>',
              ...postIds.flatMap((id) => [
                '  <url>',
                `    <loc>https://realtysh.com/posts/${id}.html</loc>`,
                '  </url>'
              ])
            ];

            const xml = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
              ...urls,
              '</urlset>',
              ''
            ].join('\n');

            fs.writeFileSync('site/sitemap.xml', xml);
            console.log(`Sitemap generated with ${postIds.length} posts.`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
            # 寃?됱뿏吏꾩슜 ?뺤쟻 寃뚯떆湲 ?섏씠吏 ?먮룞 ?앹꽦
      - name: Generate static post pages
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function escapeHtml(value) {
            return String(value ?? '')
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;')
              .replaceAll("'", '&#39;');
          }

          function firestoreValue(value = {}) {
            if ('stringValue' in value) return value.stringValue;
            if ('integerValue' in value) return Number(value.integerValue);
            if ('doubleValue' in value) return Number(value.doubleValue);
            if ('booleanValue' in value) return value.booleanValue;
            if ('timestampValue' in value) return value.timestampValue;
            if ('nullValue' in value) return null;
            if ('arrayValue' in value) {
              return (value.arrayValue.values || []).map(firestoreValue);
            }
            if ('mapValue' in value) {
              return firestoreFields(value.mapValue.fields || {});
            }
            return '';
          }

          function firestoreFields(fields = {}) {
            return Object.fromEntries(
              Object.entries(fields).map(([key, value]) => [key, firestoreValue(value)])
            );
          }

          async function main() {
            const projectId = process.env.FIREBASE_PROJECT_ID;
            const apiKey = process.env.FIREBASE_API_KEY;

            if (!projectId || !apiKey) {
              throw new Error('Firebase project ID or API key is missing.');
            }

            fs.mkdirSync('site/posts', { recursive: true });

            let url =
              `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/posts?pageSize=100&key=${apiKey}`;

            let count = 0;

            while (url) {
              const response = await fetch(url);

              if (!response.ok) {
                throw new Error(`Firestore request failed: ${response.status} ${await response.text()}`);
              }

              const data = await response.json();

              for (const doc of data.documents || []) {
                const id = doc.name.split('/').pop();
                const post = firestoreFields(doc.fields || {});

                const title = post.title || '?쒗씎 遺?숈궛 留ㅻЪ';
                const location = post.location || '?쒗씎??;
                const price = post.price || '';
                const description =
                  post.description || '?꾩쭊遺?숈궛 留ㅻЪ ?곸꽭?뺣낫?낅땲??';

                const staticUrl = `https://realtysh.com/posts/${id}.html`;
                const originalUrl =
                  `https://realtysh.com/post.html?id=${encodeURIComponent(id)}`;

                const html = `<!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>${escapeHtml(title)} | ?꾩쭊遺?숈궛</title>
            <meta name="description" content="${escapeHtml(`${location} ${title} ${price}. ${description}`)}">
            <link rel="canonical" href="${staticUrl}">
          </head>
          <body>
            <main>
              <article>
                <h1>${escapeHtml(title)}</h1>
                <p>${escapeHtml(location)}</p>
                <p>${escapeHtml(price)}</p>
                <div>${escapeHtml(description).replaceAll('\n', '<br>')}</div>
                <p><a href="${originalUrl}">?ъ쭊쨌?곸꽭?뺣낫쨌臾몄쓽 諛??볤? 蹂닿린</a></p>
              </article>
            </main>
          </body>
          </html>`;

                fs.writeFileSync(`site/posts/${id}.html`, html);
                count += 1;
              }

              url = data.nextPageToken
                ? `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/posts?pageSize=100&pageToken=${encodeURIComponent(data.nextPageToken)}&key=${apiKey}`
                : '';
            }

            console.log(`Generated ${count} static post pages.`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
