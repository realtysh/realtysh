name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site and Firebase config
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID || secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          mkdir -p site
          cp index.html post.html styles.css posts.css post.js script.js robots.txt sitemap.xml naver67821871de9a89c332917067e316e832.html google406b1ef14534d6cc.html site/
          node <<'NODE'
          const fs = require('node:fs');
          const requiredKeys = [
            'FIREBASE_API_KEY',
            'FIREBASE_AUTH_DOMAIN',
            'FIREBASE_PROJECT_ID',
            'FIREBASE_STORAGE_BUCKET',
            'FIREBASE_MESSAGING_SENDER_ID',
            'FIREBASE_APP_ID'
          ];
          const missingKeys = requiredKeys.filter((key) => !process.env[key]);
          const config = {
            apiKey: process.env.FIREBASE_API_KEY,
            authDomain: process.env.FIREBASE_AUTH_DOMAIN,
            projectId: process.env.FIREBASE_PROJECT_ID,
            storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
            messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
            appId: process.env.FIREBASE_APP_ID
          };
          if (process.env.FIREBASE_MEASUREMENT_ID) {
            config.measurementId = process.env.FIREBASE_MEASUREMENT_ID;
          }
          const output = missingKeys.length ? null : config;
          for (const pagePath of ['site/index.html', 'site/post.html']) {
            const html = fs.readFileSync(pagePath, 'utf8')
              .replaceAll('__BUILD_ID__', process.env.GITHUB_SHA);
            fs.writeFileSync(pagePath, html);
          }
          fs.writeFileSync('site/firebase-config.js', `window.REALTYSH_FIREBASE_CONFIG = ${JSON.stringify(output)};\n`);
          console.log(missingKeys.length
            ? `Firebase config incomplete; using local favorites. Missing: ${missingKeys.join(', ')}`
            : 'Firebase web config generated.');
          NODE
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4