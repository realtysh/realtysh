name: Auto SEO and Firebase Deploy

on:
  schedule:
    # GitHub Actions cron uses UTC. Every 15 minutes. Automation verified 2026-10-22.
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    # 홈페이지 핵심 파일이 main에 반영되면 즉시 SEO 재생성 + Firebase 재배포.
    # main을 홈페이지의 기준본(source of truth)으로 유지해야 예약 실행이 구버전을 덮어쓰지 않습니다.
    paths:
      - 'index.html'
      - 'script.js'
      - 'firebase-config.js'
      - 'generate-seo.js'
      - 'post.html'
      - 'post.js'
      - 'styles.css'
      - 'posts.css'
      - 'firebase.json'
      - 'robots.txt'
      - 'firestore.rules'
      - '.github/workflows/auto-seo-deploy.yml'

permissions:
  contents: write

concurrency:
  group: auto-seo-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate SEO pages, sitemap and RSS from Firestore
        run: node generate-seo.js

      - name: Save generated SEO files back to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # main 브랜치가 실행 도중 변경되어도 최신 상태를 기준으로 SEO를 다시 생성해 push합니다.
          for attempt in 1 2 3; do
            git fetch origin main

            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
              echo "Remote main changed. Refreshing from origin/main and regenerating SEO files..."
              git reset --hard origin/main
              node generate-seo.js
            fi

            if [[ -z "$(git status --porcelain -- posts sitemap.xml rss.xml)" ]]; then
              echo "SEO files are already current."
              break
            fi

            git add posts sitemap.xml rss.xml
            git commit -m "Auto SEO update"

            if git push origin HEAD:main; then
              echo "SEO files pushed successfully."
              break
            fi

            echo "Push was rejected because main changed. Retrying ($attempt/3)..."
            git reset --hard HEAD~1

            if [[ "$attempt" == "3" ]]; then
              echo "Failed to push SEO files after 3 attempts."
              exit 1
            fi
          done

      - name: Create Firebase service account file
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx --yes firebase-tools@latest deploy --only hosting --project realtysh-51b01 --non-interactive
